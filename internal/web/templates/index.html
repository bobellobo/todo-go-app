<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-gray-100 text-gray-900 max-w-md mx-auto p-4 min-h-screen">

  <h1 class="text-2xl font-bold mb-4 text-center">My Tasks</h1>

  <!-- Auth Token Input (Hidden if token exists in localStorage) -->
  <div id="auth-section" class="mb-4 p-4 bg-white rounded shadow-sm border">
    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Bearer Token</label>
    <input type="password" id="token-input" placeholder="Enter server token..." class="border p-2 w-full rounded mb-2 text-sm">
    <button onclick="saveToken()" class="bg-blue-600 text-white px-4 py-2 rounded w-full text-sm font-medium hover:bg-blue-700">Set Token</button>
  </div>

  <!-- Create Task Form -->
  <form hx-post="/web/todos"
        hx-target="#todo-list"
        hx-swap="beforeend"
        hx-on::after-request="this.reset()"
        class="flex gap-2 mb-4">
    <input type="text" name="title" placeholder="New task..." required class="border p-2 flex-grow rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded font-medium text-sm hover:bg-blue-700">Add</button>
  </form>

  <!-- Todo List Container -->
  <div id="todo-list" hx-get="/web/todos" hx-trigger="load" class="space-y-2">
    <!-- HTMX injects todo_item.html rows here -->
  </div>

  <script>
    // Automatically attach Bearer token stored in browser to every HTMX request
    document.body.addEventListener('htmx:configRequest', (evt) => {
      const token = localStorage.getItem('app_bearer_token');
      if (token) {
        evt.detail.headers['Authorization'] = 'Bearer ' + token;
      }
    });

    function saveToken() {
      const input = document.getElementById('token-input');
      if (input.value) {
        localStorage.setItem('app_bearer_token', input.value.trim());
        document.getElementById('auth-section').classList.add('hidden');
        htmx.trigger('#todo-list', 'load');
      }
    }

    // Hide token box on startup if token is already set
    if (localStorage.getItem('app_bearer_token')) {
      document.getElementById('auth-section').classList.add('hidden');
    }
  </script>
</body>
</html>
