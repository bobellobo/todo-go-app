<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff4d6">
  <link rel="manifest" href="/manifest.json">
  <title>"mùviti mbare</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    :root {
      color-scheme: light;
      --paper: #fff4d6;
      --card: #fffdf5;
      --ink: #28223e;
      --muted: #766d87;
      --line: #302744;
      --accent: #6448db;
      --accent-dark: #4932b4;
      --sage: #c9f1df;
      --sage-ink: #205a4d;
      --coral: #ff7863;
      --sun: #f6d443;
      --lilac: #e8ddff;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px 72px;
      background:
        radial-gradient(ellipse at 4% 8%, rgba(255, 120, 99, .28), transparent 22rem),
        radial-gradient(ellipse at 96% 16%, rgba(100, 72, 219, .18), transparent 26rem),
        var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
    }
    main { width: min(100%, 680px); margin: 0 auto; }
    .masthead {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 54px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--sun);
      box-shadow: 3px 3px 0 var(--ink);
      font-family: Georgia, serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0;
    }
    .intro { position: relative; margin-bottom: 30px; }
    .eyebrow {
      margin: 0 0 11px;
      color: #d64e51;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 9vw, 58px);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: 1.04;
      text-wrap: balance;
    }
    .subtitle { margin: 14px 0 0; color: var(--muted); font-size: 15px; }
    .composer, .auth-card {
      border: 2px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 6px 6px 0 var(--line);
    }
    .composer { padding: 19px; margin-bottom: 34px; }
    .composer-fields {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(145px, .42fr);
      gap: 10px;
    }
    input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      background: #fffefa;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      padding: 12px 13px;
      transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder { color: #998fa9; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(100, 72, 219, .16); }
    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 13px;
    }
    .hint { color: var(--muted); font-size: 12px; }
    button {
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
      transition: background .15s, transform .15s;
    }
    button:active { transform: translateY(1px); }
    .add-button { padding: 11px 17px; background: var(--accent); color: white; font-size: 13px; box-shadow: 3px 3px 0 var(--ink); }
    .add-button:hover { background: var(--accent-dark); }
    .list-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 13px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .list-heading::after { height: 2px; flex: 1; background: var(--line); content: ""; }
    .list-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }
    .list-toolbar .list-heading { flex: 1; margin: 0; }
    .filter-label { color: var(--muted); font-size: 11px; }
    .filter-select {
      width: auto;
      min-width: 135px;
      padding: 8px 30px 8px 10px;
      border-radius: 9px;
      font-size: 12px;
      background-color: var(--lilac);
    }
    .filter-error { margin: -5px 0 12px; color: #9a4f3f; font-size: 12px; }
    #todo-list { display: grid; gap: 9px; }
    .task-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 16px;
      border: 2px solid var(--line);
      border-radius: 15px;
      background: var(--card);
      box-shadow: 3px 3px 0 var(--line);
      transition: transform .16s, box-shadow .16s, background .16s;
    }
    .task-card:nth-child(3n + 1) { background: #fffdf5; }
    .task-card:nth-child(3n + 2) { background: #f0eaff; }
    .task-card:nth-child(3n) { background: #e4f8ee; }
    .task-card:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--line); }
    .task-main { display: flex; min-width: 0; align-items: flex-start; gap: 12px; }
    .task-checkbox {
      appearance: none;
      display: grid;
      width: 23px;
      height: 23px;
      flex: 0 0 23px;
      place-items: center;
      margin: 0;
      padding: 0;
      border: 2px solid var(--ink);
      border-radius: 7px;
      background: #fffdf5;
      cursor: pointer;
    }
    .task-checkbox::before {
      content: "✓";
      color: white;
      font-size: 15px;
      font-weight: 800;
      transform: scale(0);
      transition: transform .12s ease-in-out;
    }
    .task-checkbox:checked { border-color: #24866c; background: #24866c; }
    .task-checkbox:checked::before { transform: scale(1); }
    .task-checkbox:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
    .task-checkbox:disabled { cursor: wait; opacity: .65; }
    .task-card.is-done .task-checkbox { border-color: #24866c; background: #24866c; }
    .task-card.is-done .task-title { color: #766d87; text-decoration: line-through; }
    .task-card.is-done .task-main { opacity: .78; }
    .task-card.is-done { background: #e4f8ee; }
    .task-card.is-done .task-checkbox::before { transform: scale(1); }
    .task-copy { min-width: 0; }
    .task-title { margin: 0; overflow-wrap: anywhere; font-size: 14px; line-height: 1.45; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 7px; }
    .group-badge {
      border: 1px solid var(--ink);
      border-radius: 20px;
      background: var(--sun);
      color: var(--ink);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .035em;
      padding: 4px 8px;
    }
    .task-actions { display: flex; flex: 0 0 auto; gap: 7px; }
    .task-actions button { padding: 8px 10px; font-size: 11px; }
    .delete-button { background: #ffe0d9; color: #9c3f43; }
    .delete-button:hover { background: #ffc5b7; }
    .auth-card { margin-top: 30px; padding: 16px; }
    .auth-card[hidden] { display: none; }
    .auth-label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 650; }
    .auth-row { display: flex; gap: 9px; }
    .auth-row input { flex: 1; }
    .auth-button { padding: 0 15px; background: var(--sun); color: var(--ink); font-size: 12px; }
    .auth-button:hover { background: #ebc62c; }
    .auth-note { margin: 9px 0 0; color: var(--muted); font-size: 11px; }
    @media (max-width: 520px) {
      body { padding: 28px 16px 48px; }
      .masthead { margin-bottom: 43px; }
      .composer { padding: 14px; }
      .composer-fields { grid-template-columns: 1fr; }
      .hint { max-width: 170px; line-height: 1.4; }
    }
    @media (max-width: 430px) {
      .task-card { align-items: flex-start; gap: 8px; padding: 13px; }
      .task-actions { gap: 3px; }
      .task-actions button { padding: 7px; }
    }
  </style>
</head>
<body>
  <main>

    <header class="intro">
        <div class="masthead">bobelbozzo · task lit</div>
        <p class="eyebrow">mùviti mbaruzzo</p>
    </header>

    <form hx-post="/web/todos"
          hx-swap="none"
          hx-on::after-request="if (event.detail.successful) refreshAfterCreate(this)"
          class="composer">
      <div class="composer-fields">
        <input type="text" name="title" placeholder="add task here" aria-label="Task title" required>
        <input type="text" name="group" placeholder="group (optional)" aria-label="Task group">
      </div>
      <div class="composer-footer">
        <button type="submit" class="add-button">add <span aria-hidden="true">+</span></button>
      </div>
    </form>

    <div class="list-toolbar">
      <div class="list-heading">tasks</div>
      <label class="filter-label" for="group-filter">group</label>
      <select id="group-filter" name="group" class="filter-select"
              hx-get="/web/todos" hx-trigger="change" hx-target="#todo-list"
              hx-swap="innerHTML">
        <option value="">all tasks</option>
      </select>
    </div>
    <p id="filter-error" class="filter-error" role="status" hidden></p>
    <div id="todo-list" hx-get="/web/todos" hx-trigger="load, refreshTasks" hx-include="#group-filter">
      <!-- HTMX injects todo_item.html rows here -->
    </div>

    <section id="auth-section" class="auth-card" aria-label="Server authentication">
      <label class="auth-label" for="token-input">connect to your task server</label>
      <div class="auth-row">
        <input type="password" id="token-input" placeholder="Server access token" autocomplete="off">
        <button type="button" onclick="saveToken()" class="auth-button">save token</button>
      </div>
      <p class="auth-note">token stays in this browser and is sent only with task requests</p>
    </section>
  </main>

  <script>
    document.body.addEventListener('htmx:configRequest', (evt) => {
      const token = localStorage.getItem('app_bearer_token');
      if (token) {
        evt.detail.headers['Authorization'] = 'Bearer ' + token;
      }
    });

    async function loadGroupFilterOptions() {
      const token = localStorage.getItem('app_bearer_token');
      if (!token) return;

      const error = document.getElementById('filter-error');
      try {
        const response = await fetch('/web/groups', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!response.ok) {
          throw new Error('Could not load groups (' + response.status + ').');
        }

        const groups = await response.json();
        const filter = document.getElementById('group-filter');
        const selectedGroup = filter.value;
        filter.replaceChildren(new Option('All groups', ''));
        groups.forEach((group) => filter.add(new Option(group, group)));
        if (groups.includes(selectedGroup)) filter.value = selectedGroup;
        error.hidden = true;
      } catch (err) {
        error.textContent = err.message || 'Could not load groups.';
        error.hidden = false;
      }
    }

    async function refreshAfterCreate(form) {
      const group = form.querySelector('[name="group"]').value.trim();
      const selectedGroup = document.getElementById('group-filter').value;
      form.reset();
      await loadGroupFilterOptions();
      const filter = document.getElementById('group-filter');
      filter.value = selectedGroup && selectedGroup !== group ? group : selectedGroup;
      htmx.trigger('#todo-list', 'refreshTasks');
    }

    function saveToken() {
      const input = document.getElementById('token-input');
      if (input.value.trim()) {
        localStorage.setItem('app_bearer_token', input.value.trim());
        document.getElementById('auth-section').hidden = true;
        loadGroupFilterOptions();
        htmx.trigger('#todo-list', 'refreshTasks');
      }
    }

    if (localStorage.getItem('app_bearer_token')) {
      document.getElementById('auth-section').hidden = true;
      loadGroupFilterOptions();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .catch((err) => console.error('Service worker registration failed:', err));
    }
  </script>
</body>
</html>
