<article id="todo-{{ .ID }}" class="task-card{{ if .Done }} is-done{{ end }}">
  <div class="task-main">
    <input type="checkbox"
           class="task-checkbox"
           {{ if .Done }}checked{{ end }}
           hx-patch="/web/todos/{{ .ID }}/toggle"
           hx-trigger="change"
           hx-target="#todo-{{ .ID }}"
           hx-swap="outerHTML"
           aria-label="{{ if .Done }}Mark {{ .Title }} as not done{{ else }}Complete {{ .Title }}{{ end }}">
    <div class="task-copy">
      <p class="task-title">{{ .Title }}</p>
      {{ if .Group }}
      <div class="task-meta"><span class="group-badge">{{ .Group }}</span></div>
      {{ end }}
    </div>
  </div>
  <div class="task-actions">
    <button hx-delete="/web/todos/{{ .ID }}"
            hx-target="#todo-{{ .ID }}"
            hx-swap="delete"
            class="delete-button"
            aria-label="Delete {{ .Title }}">Delete</button>
  </div>
</article>
