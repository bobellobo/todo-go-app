<article id="todo-{{ .ID }}" class="task-card{{ if .Done }} is-done{{ end }}">
  <div class="task-main">
    <span class="task-marker" aria-hidden="true">{{ if .Done }}✓{{ end }}</span>
    <div class="task-copy">
      <p class="task-title">{{ .Title }}</p>
      {{ if .Group }}
      <div class="task-meta"><span class="group-badge">{{ .Group }}</span></div>
      {{ end }}
    </div>
  </div>
  <div class="task-actions">
    <button hx-patch="/web/todos/{{ .ID }}/toggle"
            hx-target="#todo-{{ .ID }}"
            hx-swap="outerHTML"
            class="complete-button"
            aria-label="{{ if .Done }}Mark {{ .Title }} as not done{{ else }}Complete {{ .Title }}{{ end }}">
      {{ if .Done }}Undo{{ else }}Done{{ end }}
    </button>
    <button hx-delete="/web/todos/{{ .ID }}"
            hx-target="#todo-{{ .ID }}"
            hx-swap="delete"
            class="delete-button"
            aria-label="Delete {{ .Title }}">Delete</button>
  </div>
</article>
